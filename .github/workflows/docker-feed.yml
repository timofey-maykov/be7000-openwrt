name: Build Go packages

# Docker, and everything else written in Go, cannot be built on an arm64 host:
# OpenWrt's golang-bootstrap refuses to install there, so the local build box
# cannot produce dockerd, containerd, runc, rclone or zerotier. GitHub runners
# are x86_64, which is why this exists.
#
# The result is uploaded as an artifact rather than published. Indexing signs
# the feed with the key the firmware trusts, and that key stays off GitHub.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to build, space separated"
        default: "dockerd docker docker-compose containerd runc luci-app-dockerman rclone zerotier dnscrypt-proxy2"
        required: true

env:
  OWRT_REPO: https://github.com/kravasuper/openwrt.git
  OWRT_BRANCH: xiaomi_be7000
  OWRT_COMMIT: 790d036a
  VERSION_STRING: r20260623-790d036a

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      # The OpenWrt tree plus a toolchain does not fit next to the preinstalled
      # SDKs the runner image ships.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Check out the port
        run: |
          git clone --branch "$OWRT_BRANCH" --single-branch "$OWRT_REPO" owrt
          cd owrt
          git checkout "$OWRT_COMMIT"
          # base-files needs a version and the tarball has no .git
          echo "$VERSION_STRING" > version

      - name: Apply patches and overlay
        run: |
          cd owrt
          cp ../patches/*.patch target/linux/qualcommbe/patches-6.18/
          for p in ../patches/tree/*.patch; do
            patch -p1 < "$p"
          done
          mkdir -p files
          cp -a ../overlay-files/. files/

      - name: Pin and install feeds
        run: |
          cd owrt
          while read -r name rev _; do
            [ -n "$name" ] || continue
            sed -i "s|^\(src-git\(-full\)\? $name .*\)\(\^\|;\).*$|\1^$rev|" feeds.conf.default || true
          done < ../feeds-pins.txt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd owrt
          cp ../config.buildinfo .config
          for p in ${{ github.event.inputs.packages }}; do
            echo "CONFIG_PACKAGE_$p=m" >> .config
          done
          make defconfig
          echo "=== selected as modules ==="
          for p in ${{ github.event.inputs.packages }}; do
            grep -q "^CONFIG_PACKAGE_$p=m" .config && echo "  ok   $p" || echo "  MISS $p"
          done

      - name: Download sources
        run: cd owrt && make -j"$(nproc)" download

      - name: Build
        run: cd owrt && make -j"$(nproc)" world || make -j1 world V=s

      - name: Collect packages
        run: |
          cd owrt
          mkdir -p ../out
          find bin/packages bin/targets -name '*.apk' -print0 | xargs -0 -I{} cp {} ../out/ || true
          ls -1 ../out | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: go-packages
          path: out/
          retention-days: 14
