name: Owner-only source policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  owner-only:
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-owner source changes
        env:
          ACTOR: ${{ github.actor }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          OWNER: timofey-maykov
          OWNER_REPOSITORY: timofey-maykov/be7000-openwrt
        run: |
          set -eu
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "Only $OWNER may submit source changes; actor is $ACTOR" >&2
            exit 1
          fi
          if [ "$HEAD_REPOSITORY" != "$OWNER_REPOSITORY" ]; then
            echo "Owner changes must originate in $OWNER_REPOSITORY" >&2
            exit 1
          fi
          echo "owner-only source policy: PASS"
