# Docker pulls in br_netfilter, which turns these on and sends all bridged LAN
# traffic through the firewall hooks a second time. That breaks the Hybrid
# Failover proxy path for LAN clients. Docker does not need them for routed
# traffic, so keep them off.
net.bridge.bridge-nf-call-iptables=0
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-arptables=0
