# The lvm2 package's empty config, plus a device filter: LVM never lives on
# the raw flash partitions, and scanning them at boot only costs time.
config {
}
devices {
	global_filter = [ "r|^/dev/mtdblock|", "r|^/dev/ubiblock|", "a|.*|" ]
}
